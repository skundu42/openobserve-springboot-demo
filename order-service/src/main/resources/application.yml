spring:
  application:
    name: order-service

server:
  port: ${SERVER_PORT:8080}

inventory:
  base-url: ${INVENTORY_BASE_URL:http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5level service=${spring.application.name} trace_id=%X{trace_id:-} span_id=%X{span_id:-} logger=%logger{36} - %msg%n"

